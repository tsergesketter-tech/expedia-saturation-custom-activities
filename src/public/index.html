<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedia saturation model demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="logo" href="/" aria-label="Expedia saturation model demo home"><img src="/expedia-logo.png" alt="Expedia"></a>
    <nav class="pathways" aria-label="Pathway">
      <a href="/" aria-current="page">Journey callouts (sync / async)</a>
      <a href="/event.html">Model eventing to the DE</a>
    </nav>
    <nav class="connections" id="connections" aria-label="Connected systems"></nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Should we message this traveler?</h1>
  </div>
</section>

<section class="wrap widget" aria-label="Choose a traveler">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="widget-body" id="widget"></div>
</section>

<section class="wrap verdict" id="verdict" aria-live="polite"></section>

<section class="wrap trace-section">
  <div class="trace-grid">
    <div>
      <h2 id="traceTitle">Trip through Marketing Cloud</h2>
      <p class="sub" id="traceSub"></p>
      <ol class="trace" id="trace"></ol>
    </div>
    <aside class="landed" id="landed" aria-label="Where the prediction landed"></aside>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <div class="band-head">
      <div>
        <h2>All travelers</h2>
        <p class="sub">Latest prediction for each One Key member. Pick one to follow.</p>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </div>
</section>

<section class="wrap settings" aria-labelledby="settingsTitle">
  <h2 id="settingsTitle">Model settings</h2>
  <div class="settings-row">
    <label class="field">
      <span>Abstain when score is above <output id="thresholdOut">0.65</output></span>
      <input id="threshold" type="range" min="0.3" max="0.95" step="0.01" value="0.65">
    </label>
    <label class="field">
      <span>Async model takes <output id="asyncDelayOut">8s</output></span>
      <input id="asyncDelay" type="range" min="0" max="30" step="1" value="8">
    </label>
    <label class="field">
      <span>Async result returns to MCE by</span>
      <select id="cdcMode">
        <option value="rest">REST upsert to the data extension</option>
        <option value="s3">S3 file, then MCE import</option>
        <option value="both">Both</option>
      </select>
    </label>
  </div>
  <div class="settings-actions">
    <button class="btn" id="batchBtn">Score all travelers to Databricks</button>
    <button class="btn outline" id="importBtn">Import S3 file into MCE</button>
    <button class="btn text" id="resetBtn">Reset travelers</button>
  </div>
  <details class="log">
    <summary>All activity <span id="logCount"></span></summary>
    <ol id="events"></ol>
  </details>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
